<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PolyModeler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #app {
            width: 100vw;
            height: 100vh;
        }

        /* Toolbar */
        #toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .btn {
            width: 56px;
            height: 56px;
            background: rgba(60, 60, 60, 0.8);
            border: none;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: rgba(80, 80, 80, 0.9);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.active {
            background: rgba(0, 180, 255, 0.4);
            border: 2px solid rgba(0, 180, 255, 0.8);
        }

        /* Side Panel */
        .panel {
            position: fixed;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
            display: none;
        }

        .panel.visible {
            display: block;
        }

        .panel h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 16px;
        }

        /* Shapes Panel */
        #shapes-panel {
            top: 100px;
            left: 20px;
            width: 200px;
        }

        .shape-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            background: rgba(60, 60, 60, 0.8);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shape-btn:hover {
            background: rgba(80, 80, 80, 0.9);
        }

        /* Transform Panel */
        #transform-panel {
            bottom: 20px;
            right: 20px;
            width: 320px;
        }

        .transform-section {
            margin-bottom: 16px;
        }

        .transform-section h4 {
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .transform-controls {
            display: flex;
            gap: 8px;
        }

        .transform-btn {
            flex: 1;
            padding: 12px;
            background: rgba(60, 60, 60, 0.8);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .transform-btn:hover {
            background: rgba(80, 80, 80, 0.9);
        }

        .transform-btn:active {
            background: rgba(100, 100, 100, 1);
        }

        /* Color Panel */
        #color-panel {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-swatch {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .color-swatch.active {
            border-color: #fff;
        }

        /* Info Panel */
        #info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px;
            color: #aaa;
            font-size: 13px;
            max-width: 200px;
            z-index: 100;
        }

        #info h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }

        #info p {
            margin: 4px 0;
        }

        #selection-info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #0bf;
        }

        #selection-info.empty {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Toolbar -->
    <div id="toolbar">
        <button class="btn" id="btn-shapes" title="Add Shape">➕</button>
        <button class="btn" id="btn-transform" title="Transform">↔️</button>
        <button class="btn" id="btn-color" title="Color">🎨</button>
        <button class="btn" id="btn-wireframe" title="Wireframe">◻️</button>
        <button class="btn" id="btn-delete" title="Delete">🗑️</button>
        <button class="btn" id="btn-export" title="Export OBJ">💾</button>
    </div>

    <!-- Shapes Panel -->
    <div id="shapes-panel" class="panel">
        <h3>Add Shape</h3>
        <button class="shape-btn" data-shape="box">📦 Cube</button>
        <button class="shape-btn" data-shape="sphere">⚪ Sphere</button>
        <button class="shape-btn" data-shape="cylinder">🔵 Cylinder</button>
        <button class="shape-btn" data-shape="cone">🔺 Cone</button>
        <button class="shape-btn" data-shape="torus">🍩 Torus</button>
    </div>

    <!-- Transform Panel -->
    <div id="transform-panel" class="panel">
        <h3>Transform</h3>

        <div class="transform-section">
            <h4>Move</h4>
            <div class="transform-controls">
                <button class="transform-btn" data-action="move" data-axis="x" data-delta="-0.5">⬅️</button>
                <button class="transform-btn" data-action="move" data-axis="x" data-delta="0.5">➡️</button>
                <button class="transform-btn" data-action="move" data-axis="y" data-delta="-0.5">⬇️</button>
                <button class="transform-btn" data-action="move" data-axis="y" data-delta="0.5">⬆️</button>
            </div>
        </div>

        <div class="transform-section">
            <h4>Rotate</h4>
            <div class="transform-controls">
                <button class="transform-btn" data-action="rotate" data-axis="x" data-delta="0.2">↻ X</button>
                <button class="transform-btn" data-action="rotate" data-axis="y" data-delta="0.2">↻ Y</button>
                <button class="transform-btn" data-action="rotate" data-axis="z" data-delta="0.2">↻ Z</button>
            </div>
        </div>

        <div class="transform-section">
            <h4>Scale</h4>
            <div class="transform-controls">
                <button class="transform-btn" data-action="scale" data-delta="-0.2">➖</button>
                <button class="transform-btn" data-action="scale" data-delta="0.2">➕</button>
            </div>
        </div>
    </div>

    <!-- Color Panel -->
    <div id="color-panel" class="panel">
        <h3>Color</h3>
        <div class="color-grid">
            <div class="color-swatch" style="background: #ff6b6b;" data-color="#ff6b6b"></div>
            <div class="color-swatch" style="background: #4ecdc4;" data-color="#4ecdc4"></div>
            <div class="color-swatch" style="background: #45b7d1;" data-color="#45b7d1"></div>
            <div class="color-swatch" style="background: #ffa07a;" data-color="#ffa07a"></div>
            <div class="color-swatch" style="background: #98d8c8;" data-color="#98d8c8"></div>
            <div class="color-swatch" style="background: #f7dc6f;" data-color="#f7dc6f"></div>
            <div class="color-swatch" style="background: #a29bfe;" data-color="#a29bfe"></div>
            <div class="color-swatch" style="background: #fd79a8;" data-color="#fd79a8"></div>
            <div class="color-swatch" style="background: #fdcb6e;" data-color="#fdcb6e"></div>
            <div class="color-swatch" style="background: #6c5ce7;" data-color="#6c5ce7"></div>
            <div class="color-swatch" style="background: #00b894;" data-color="#00b894"></div>
            <div class="color-swatch" style="background: #e17055;" data-color="#e17055"></div>
        </div>
    </div>

    <!-- Info Panel -->
    <div id="info">
        <h3>PolyModeler</h3>
        <p>Click to select</p>
        <p>Drag to orbit</p>
        <p>Scroll to zoom</p>
        <div id="selection-info" class="empty">No selection</div>
    </div>

    <script type="module">
        import { PolyModeler } from './app.ts';

        const app = new PolyModeler(document.getElementById('app'));

        // UI Elements
        const btnShapes = document.getElementById('btn-shapes');
        const btnTransform = document.getElementById('btn-transform');
        const btnColor = document.getElementById('btn-color');
        const btnWireframe = document.getElementById('btn-wireframe');
        const btnDelete = document.getElementById('btn-delete');
        const btnExport = document.getElementById('btn-export');

        const shapesPanel = document.getElementById('shapes-panel');
        const transformPanel = document.getElementById('transform-panel');
        const colorPanel = document.getElementById('color-panel');
        const selectionInfo = document.getElementById('selection-info');

        let wireframeMode = false;

        // Toggle panels
        function togglePanel(panel, button) {
            const isVisible = panel.classList.contains('visible');

            // Close all panels
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));

            // Toggle current
            if (!isVisible) {
                panel.classList.add('visible');
                button.classList.add('active');
            }
        }

        btnShapes.addEventListener('click', () => togglePanel(shapesPanel, btnShapes));
        btnTransform.addEventListener('click', () => togglePanel(transformPanel, btnTransform));
        btnColor.addEventListener('click', () => togglePanel(colorPanel, btnColor));

        // Add shapes
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const shape = btn.dataset.shape;
                const mesh = app.addPrimitive(shape);
                app.selectModel(mesh);
                shapesPanel.classList.remove('visible');
                btnShapes.classList.remove('active');
            });
        });

        // Transform controls
        document.querySelectorAll('.transform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                const axis = btn.dataset.axis;
                const delta = parseFloat(btn.dataset.delta);

                if (action === 'move') {
                    app.moveSelected(axis, delta);
                } else if (action === 'rotate') {
                    app.rotateSelected(axis, delta);
                } else if (action === 'scale') {
                    app.scaleSelected(delta);
                }
            });
        });

        // Color swatches
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', () => {
                const color = swatch.dataset.color;
                app.setColor(color);

                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
            });
        });

        // Wireframe
        btnWireframe.addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            app.setWireframe(wireframeMode);
            btnWireframe.classList.toggle('active', wireframeMode);
        });

        // Delete
        btnDelete.addEventListener('click', () => {
            app.deleteSelected();
        });

        // Export
        btnExport.addEventListener('click', () => {
            app.downloadOBJ();
        });

        // Selection feedback
        window.addEventListener('modelSelected', (e) => {
            const model = e.detail.model;
            if (model) {
                selectionInfo.textContent = 'Object selected';
                selectionInfo.classList.remove('empty');
            } else {
                selectionInfo.textContent = 'No selection';
                selectionInfo.classList.add('empty');
            }
        });

        // Close panels when clicking on canvas
        document.getElementById('app').addEventListener('click', () => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        });
    </script>
</body>
</html>
